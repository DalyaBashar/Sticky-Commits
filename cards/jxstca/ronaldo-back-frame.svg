<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- blood band and drips along the top -->
  <rect x="0" y="0" width="300" height="6" fill="#B80F1A"/>
  <g stroke="#B80F1A" stroke-linecap="round">
    <line x1="30" y1="4" x2="30" y2="26" stroke-width="6"><animate attributeName="y2" values="26;40;26" dur="4s" repeatCount="indefinite"/></line>
    <line x1="72" y1="4" x2="72" y2="14" stroke-width="5"><animate attributeName="y2" values="14;24;14" dur="3.1s" repeatCount="indefinite"/></line>
    <line x1="118" y1="4" x2="118" y2="34" stroke-width="7"><animate attributeName="y2" values="34;50;34" dur="5s" repeatCount="indefinite"/></line>
    <line x1="170" y1="4" x2="170" y2="18" stroke-width="5"><animate attributeName="y2" values="18;30;18" dur="3.6s" repeatCount="indefinite"/></line>
    <line x1="216" y1="4" x2="216" y2="30" stroke-width="6"><animate attributeName="y2" values="30;44;30" dur="4.4s" repeatCount="indefinite"/></line>
    <line x1="264" y1="4" x2="264" y2="20" stroke-width="5"><animate attributeName="y2" values="20;32;20" dur="3.4s" repeatCount="indefinite"/></line>
  </g>

  <!-- corners and a thin inner line -->
  <g fill="none" stroke="#B80F1A" stroke-width="2.5" stroke-linecap="round">
    <path d="M14 42 V14 H42"/>
    <path d="M258 14 H286 V42"/>
    <path d="M14 358 V386 H42"/>
    <path d="M258 386 H286 V358"/>
  </g>
  <rect x="10" y="10" width="280" height="380" fill="none" stroke="#B80F1A" stroke-opacity="0.3" stroke-width="1"/>

  <!-- big faint stamp across the middle -->
  <g transform="rotate(-24 150 210)" fill="none" stroke="#B80F1A" stroke-opacity="0.18">
    <rect x="10" y="182" width="280" height="56" stroke-width="3"/>
    <rect x="16" y="188" width="268" height="44" stroke-width="1"/>
  </g>
  <text transform="rotate(-24 150 210)" x="150" y="219" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#B80F1A" fill-opacity="0.18">OWNER OF THE UEFA</text>

  <!-- bottom left: barcode and small code -->
  <g fill="#B80F1A" fill-opacity="0.6">
    <rect x="22" y="352" width="2" height="22"/><rect x="27" y="352" width="4" height="22"/>
    <rect x="34" y="352" width="1.5" height="22"/><rect x="39" y="352" width="3" height="22"/>
    <rect x="45" y="352" width="1.5" height="22"/><rect x="50" y="352" width="4" height="22"/>
    <rect x="57" y="352" width="2" height="22"/><rect x="62" y="352" width="3" height="22"/>
    <rect x="68" y="352" width="1.5" height="22"/><rect x="73" y="352" width="4" height="22"/>
  </g>
  <text x="22" y="386" font-family="monospace" font-size="8" fill="#E0222F" fill-opacity="0.8">UEFA-007 · CLASSIFIED</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
